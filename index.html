<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiaoQian · Feline Oracle</title>
<style>
:root{--bg:#1a1218;--card:#2a1f28;--accent:#ff6b8a;--text:#f5eef2;--muted:#a89aaa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:2rem;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:24px;font-size:.9rem}
.pet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;width:100%;max-width:400px}
.pet-btn{background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px 8px;cursor:pointer;text-align:center;transition:.2s;font-size:.85rem}
.pet-btn.active{border-color:var(--accent);background:#3a2530}
.pet-btn .emoji{font-size:2rem;display:block;margin-bottom:4px}
#result{width:100%;max-width:400px;background:var(--card);border-radius:20px;padding:24px;display:none}
#result.show{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sign-level{text-align:center;margin-bottom:12px}
.sign-level .char{font-size:3rem;font-weight:700}
.sign-level .char.大吉{color:#ffd700}.sign-level .char.吉{color:#7ecfa0}.sign-level .char.中{color:#8ab4d6}.sign-level .char.小吉{color:#c4a8e0}.sign-level .char.凶{color:#e87070}
.sign-title{text-align:center;font-size:1.1rem;margin-bottom:16px;color:var(--accent)}
.sign-text{line-height:1.8;font-size:.95rem;margin-bottom:16px;white-space:pre-line}
.section-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px}
#actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#actions button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:.85rem}
#actions button.secondary{background:transparent;border:1px solid var(--muted);color:var(--text)}
.streak-bar{background:var(--card);border-radius:12px;padding:12px;margin-bottom:16px;width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.streak-bar .num{font-size:1.4rem;font-weight:700;color:var(--accent)}
.codex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:400px;margin-bottom:16px}
.codex-cell{aspect-ratio:1;background:var(--card);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;opacity:.3}
.codex-cell.lit{opacity:1;background:#3a2530}
.pet-dialog{background:#2d1f28;border-left:3px solid var(--accent);padding:12px 16px;margin-top:16px;border-radius:0 12px 12px 0;font-size:.9rem;line-height:1.6}
.pet-dialog .pet-name{font-weight:700;color:var(--accent);font-size:.8rem;margin-bottom:4px}
/* —— 成图 / 合签 / 照片出签 —— */
.extra-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;width:100%;max-width:400px}
.extra-actions button{flex:1;min-width:120px;background:#2d1f28;border:1px solid var(--muted);color:var(--text);border-radius:10px;padding:10px 8px;cursor:pointer;font-size:.8rem;transition:.2s}
.extra-actions button:hover{border-color:var(--accent)}
.match-panel{width:100%;max-width:400px;background:var(--card);border-radius:16px;padding:16px;margin-top:16px;display:none}
.match-panel.show{display:block;animation:fadeIn .3s}
.match-pick{display:flex;gap:8px;justify-content:center;margin:10px 0}
.match-pick select{background:#2d1f28;color:var(--text);border:1px solid var(--muted);border-radius:8px;padding:8px 12px;font-size:.9rem}
.match-result{text-align:center;margin-top:12px;font-size:1.6rem;font-weight:700;color:var(--accent)}
.match-text{margin-top:8px;font-size:.9rem;line-height:1.6;color:var(--text)}
.photo-panel{width:100%;max-width:400px;background:var(--card);border-radius:16px;padding:16px;margin-top:16px;display:none;text-align:center}
.photo-panel.show{display:block;animation:fadeIn .3s}
.photo-panel input[type=file]{margin:8px 0;cursor:pointer}
.photo-result{margin-top:12px;font-size:.9rem;line-height:1.6}
.photo-result .sign-level .char{font-size:2rem}
/* —— 语言切换 —— */
.lang-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;width:100%;max-width:400px;justify-content:center}
.lang-bar button{background:var(--card);border:1px solid var(--muted);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.75rem;transition:.2s}
.lang-bar button.active{border-color:var(--accent);background:#3a2530}
</style>
</head>
<body>
<h1>🐾 <span data-i18n="title">MiaoQian</span></h1>
<p class="sub" data-i18n="subtitle">Draw a sign, let your pet speak for you</p>

<div class="lang-bar" id="langBar"></div>

<div class="streak-bar" id="streakBar" style="display:none">
  <span data-i18n="streak">🔥 Streak</span>
  <span class="num" id="streakNum">0</span>
</div>

<div class="pet-grid" id="petGrid"></div>

<div id="result">
  <div class="sign-level"><span class="char" id="levelChar"></span></div>
  <div class="sign-title" id="signTitle"></div>
  <div class="section-label" data-i18n="labelSign">Sign Text</div>
  <div class="sign-text" id="signText"></div>
  <div class="section-label" id="sectionLabel"></div>
  <div class="sign-text" id="sectionText"></div>
  <div class="pet-dialog" id="petDialog" style="display:none">
    <div class="pet-name" id="petDialogName"></div>
    <div id="petDialogText"></div>
  </div>
  <div id="actions">
    <button onclick="drawAgain()" data-i18n="btnDraw">Draw Again</button>
    <button class="secondary" onclick="switchTone()" data-i18n="btnTone">Switch Tone</button>
  </div>
</div>

<!-- 🖼 签文成图 -->
<div class="extra-actions" id="extraActions" style="display:none;margin-top:12px">
  <button onclick="makeSignImage()" data-i18n="btnImage">🖼 Save as Image</button>
  <button onclick="showMatch()" data-i18n="btnMatch">💞 Match Test</button>
  <button onclick="showPhoto()" data-i18n="btnPhoto">📸 Photo Sign</button>
</div>

<!-- 💞 合签·缘分 -->
<div class="match-panel" id="matchPanel">
  <div class="section-label" data-i18n="matchTitle">Match · Affinity Test</div>
  <div class="match-pick">
    <select id="matchA"></select>
    <span style="align-self:center;color:var(--muted)">＋</span>
    <select id="matchB"></select>
  </div>
  <button onclick="drawMatch()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 24px;cursor:pointer;width:100%" data-i18n="btnTest">Test It</button>
  <div class="match-result" id="matchResult"></div>
  <div class="match-text" id="matchText"></div>
</div>

<!-- 📸 照片出签 -->
<div class="photo-panel" id="photoPanel">
  <div class="section-label" data-i18n="photoTitle">Photo Sign · Local Only, Nothing Uploaded</div>
  <input type="file" id="photoInput" accept="image/*">
  <div class="photo-result" id="photoResult"></div>
</div>

<div class="codex" id="codex" style="margin-top:24px"></div>
<p style="margin-top:12px;font-size:.75rem;color:var(--muted)" id="codexLabel"></p>

/* ============ state ============ */
let currentSection='love';
let currentSign=null;
let currentPet=null;
let currentLang=localStorage.getItem('mq_lang')||'en';

const SECTION_KEYS=['love','work','money','health'];

/* ============ i18n apply ============ */
function getLang(){return LANGS[currentLang]||LANGS.en}
function t(key){return getLang()[key]||key}
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    el.textContent=t(key);
  });
  document.documentElement.lang=currentLang==='zh'?'zh-CN':currentLang;
  renderPets();
  renderCodex();
  updateLangBar();
  if(currentSign)renderSign(currentSign);
}
function switchLang(l){
  currentLang=l;localStorage.setItem('mq_lang',l);
  applyLang();
}
function buildLangBar(){
  const bar=document.getElementById('langBar');
  bar.innerHTML='';
  Object.entries(LANGS).forEach(([code,lang])=>{
    const btn=document.createElement('button');
    btn.textContent=lang.label;btn.dataset.code=code;
    if(code===currentLang)btn.classList.add('active');
    btn.onclick=()=>switchLang(code);
    bar.appendChild(btn);
  });
}
function updateLangBar(){
  document.querySelectorAll('#langBar button').forEach(b=>{
    b.classList.toggle('active',b.dataset.code===currentLang);
  });
}

/* ============ render ============ */
function renderPets(){
  const grid=document.getElementById('petGrid');
  grid.innerHTML='';
  PETS.forEach(p=>{
    const btn=document.createElement('button');
    btn.className='pet-btn'+(currentPet&&currentPet.id===p.id?' active':'');
    btn.dataset.id=p.id;
    btn.innerHTML=`<span class="emoji">${p.emoji}</span>${p.name}`;
    btn.onclick=()=>drawSign(p);
    grid.appendChild(btn);
  });
}
function renderCodex(){
  const box=document.getElementById('codex');
  const seen=JSON.parse(localStorage.getItem('mq_codex')||'[]');
  box.innerHTML='';
  for(let i=0;i<8;i++){
    const cell=document.createElement('div');
    cell.className='codex-cell'+(seen.includes(i)?' lit':'');
    cell.textContent=seen.includes(i)?PETS[i].emoji:'';
    box.appendChild(cell);
  }
  const label=document.getElementById('codexLabel');
  label.textContent=t('codex')+': '+seen.length+' / 8';
}
function saveCodex(level){
  const seen=JSON.parse(localStorage.getItem('mq_codex')||'[]');
  if(!seen.includes(PETS.indexOf(currentPet)))seen.push(PETS.indexOf(currentPet));
  localStorage.setItem('mq_codex',JSON.stringify(seen));
  renderCodex();
}

function drawSign(pet){
  currentPet=pet;
  document.querySelectorAll('.pet-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===pet.id));
  const sign=SIGNS[Math.floor(Math.random()*SIGNS.length)];
  currentSign=sign;
  renderSign(sign);
  saveCodex(sign.level);
  saveStreak();
}
function renderSign(sign){
  const r=document.getElementById('result');r.classList.add('show');
  const lc={大吉:'#ffd700',吉:'#7ecfa0',中:'#8ab4d6',小吉:'#c4a8e0',凶:'#e87070'};
  document.getElementById('levelChar').textContent=currentLang==='zh'?sign.level:sign.title[currentLang];
  document.getElementById('levelChar').className='char '+(currentLang==='zh'?sign.level:'');
  document.getElementById('levelChar').style.color=lc[sign.level];
  document.getElementById('signTitle').textContent=sign.title[currentLang];
  document.getElementById('signText').textContent=sign.sections[currentLang][currentSection];
  const lang=getLang();
  document.getElementById('sectionLabel').textContent=lang.sec[currentSection];
  document.getElementById('sectionText').textContent=sign.sections[currentLang][currentSection];
  const TONES={soft:()=>currentPet.emoji+' '+(currentLang==='zh'?'我听到了，别急，慢慢来。':'I hear you. Take it slow, okay.'),energetic:()=>currentPet.emoji+' '+(currentLang==='zh'?'冲啊！这签说明你离好事很近！':'Go for it! This sign says good things are near!'),cute:()=>currentPet.emoji+' '+(currentLang==='zh'?'呜…有点小考验，但我会一直陪着你的！':'Aw, a little test, but I\'ll be right here with you!'),gentle:()=>currentPet.emoji+' '+(currentLang==='zh'?'嗯，我懂。深呼吸，一切都会好起来的。':'Mm, I get it. Breathe deep, everything will be okay.'),calm:()=>currentPet.emoji+' '+(currentLang==='zh'?'水往低处流，顺势而为。':'Water flows downhill. Go with the current.'),playful:()=>currentPet.emoji+' '+(currentLang==='zh'?'嘎嘎嘎！别太认真啦，签文是参考，开心最重要！':'Quack quack! Don\'t take it too seriously, the sign\'s just a guide — be happy!'),wise:()=>currentPet.emoji+' '+(currentLang==='zh'?'万物有时，你的时机未到，静心等候。':'All things have their time. Yours hasn\'t come yet. Wait in stillness.'),witty:()=>currentPet.emoji+' '+(currentLang==='zh'?'哈哈，这签我熟。翻译一下：你没那么惨，真的。':'Haha, I know this one. Translation: you\'re not as doomed as you think. Really.')};
  const dialog=TONES[currentPet.tone]();
  document.getElementById('petDialog').style.display='block';
  document.getElementById('petDialogName').textContent=t('petLabel');
  document.getElementById('petDialogText').textContent=dialog;
  document.getElementById('extraActions').style.display='flex';
}
function drawAgain(){if(currentPet)drawSign(currentPet)}
function switchTone(){
  const tones=['soft','energetic','cute','gentle','calm','playful','wise','witty'];
  const cur=tones.indexOf(currentPet.tone);
  currentPet.tone=tones[(cur+1)%tones.length];
  document.querySelectorAll('.pet-btn').forEach(b=>{
    b.querySelector('span').nextSibling.textContent=PETS.find(p=>p.id===b.dataset.id).name;
  });
  if(currentSign)renderSign(currentSign);
}

/* ============ 🖼 成图 ============ */
function makeSignImage(){
  if(!currentSign){alert('Draw a sign first');return}
  const L=getLang();
  const W=1080,H=1350;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#1a1218';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2a1f28';roundRect(ctx,40,40,W-80,H-80,30);ctx.fill();
  const lc={大吉:'#ffd700',吉:'#7ecfa0',中:'#8ab4d6',小吉:'#c4a8e0',凶:'#e87070'};
  ctx.fillStyle=lc[currentSign.level];
  const levelText=currentLang==='zh'?currentSign.level:currentSign.title[currentLang];
  ctx.font='bold 200px "PingFang SC","Helvetica Neue",sans-serif';ctx.textAlign='center';
  ctx.fillText(levelText,W/2,320);
  ctx.fillStyle='#ff6b8a';ctx.font='bold 56px "PingFang SC","Helvetica Neue",sans-serif';
  ctx.fillText(currentSign.title[currentLang],W/2,440);
  ctx.fillStyle='#f5eef2';ctx.font='36px "PingFang SC","Helvetica Neue",sans-serif';
  wrapText(ctx,currentSign.sections[currentLang][currentSection],W/2,560,W-200,52);
  ctx.fillStyle='#a89aaa';ctx.font='32px "PingFang SC","Helvetica Neue",sans-serif';
  ctx.fillText(currentPet.emoji+' '+currentPet.name,W/2,H-200);
  ctx.fillStyle='#5a4a52';ctx.font='24px "Helvetica Neue",sans-serif';
  ctx.fillText('MiaoQian · Feline Oracle',W/2,H-80);
  const a=document.createElement('a');
  a.download='miaoqian-'+currentSign.level+'.png';
  a.href=c.toDataURL('image/png');a.click();
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapText(ctx,text,x,y,maxW,lh){let line='',yy=y;for(let i=0;i<text.length;i++){const t=line+text[i];if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);line=text[i];yy+=lh}else line=t}if(line)ctx.fillText(line,x,yy)}

/* ============ 💞 合签 ============ */
const MATCH={
  high:['owl×fox','fox×owl','owl×axolotl','axolotl×owl'],
  low:['duck×cat','cat×duck','duck×dog','dog×duck']
};
function showMatch(){
  const panel=document.getElementById('matchPanel');
  panel.classList.toggle('show');
  const a=document.getElementById('matchA'),b=document.getElementById('matchB');
  if(a.options.length===0){
    PETS.forEach(p=>{a.add(new Option(p.emoji+' '+p.name,p.id));b.add(new Option(p.emoji+' '+p.name,p.id))});
    a.value='owl';b.value='fox';
  }
  document.getElementById('matchResult').textContent='';
  document.getElementById('matchText').textContent='';
}
function drawMatch(){
  const L=getLang();
  const a=document.getElementById('matchA').value,b=document.getElementById('matchB').value;
  if(a===b){alert('Pick two different pets');return}
  const key=a+'×'+b,pair=PETS.find(p=>p.id===a),pair2=PETS.find(p=>p.id===b);
  let verdict;
  if(MATCH.high.includes(key)||MATCH.high.includes(b+'×'+a)) verdict={score:'92%',text:currentLang==='zh'?pair.emoji+' 和 '+pair2.emoji+' 天造地设的一对，凑一起火花带闪电。':pair.emoji+' and '+pair2.emoji+' are a match made in heaven — sparkles guaranteed.'};
  else if(MATCH.low.includes(key)||MATCH.low.includes(b+'×'+a)) verdict={score:'41%',text:currentLang==='zh'?pair.emoji+' 和 '+pair2.emoji+' 有点难凑，性格差太远，建议各找各的缘。':pair.emoji+' and '+pair2.emoji+' are a stretch — very different energy. Better off on separate paths.'};
  else verdict={score:'68%',text:currentLang==='zh'?pair.emoji+' 和 '+pair2.emoji+' 属于"处得可以"型，不吵不闹，慢慢养就熟了。':pair.emoji+' and '+pair2.emoji+' get along fine — no drama, just time to grow on each other.'};
  document.getElementById('matchResult').textContent=verdict.score;
  document.getElementById('matchText').textContent=verdict.text;
}

/* ============ 📸 照片出签 ============ */
function showPhoto(){
  const panel=document.getElementById('photoPanel');
  panel.classList.toggle('show');
}
function signFromData(dataUrl,name){
  const L=getLang();
  let seed=0;const s=dataUrl.slice(0,500)+name;for(let i=0;i<s.length;i++)seed=(seed*31+s.charCodeAt(i))>>>0;
  const sign=SIGNS[seed%SIGNS.length];
  const box=document.getElementById('photoResult');
  const lc={大吉:'#ffd700',吉:'#7ecfa0',中:'#8ab4d6',小吉:'#c4a8e0',凶:'#e87070'};
  const levelText=currentLang==='zh'?sign.level:sign.title[currentLang];
  box.innerHTML=`<div style="color:${lc[sign.level]};font-size:2rem;font-weight:700">${levelText}</div><div style="font-weight:700;color:var(--accent);margin:8px 0">${sign.title[currentLang]}</div><div style="color:var(--text);line-height:1.6">${sign.sections[currentLang].love}</div><div style="margin-top:10px;font-size:.8rem;color:var(--muted)">${L.localNote}</div>`;
  saveCodex(sign.level);
}

/* ============ streak ============ */
function saveStreak(){
  const today=new Date().toDateString();
  const last=localStorage.getItem('mq_last');
  let streak=parseInt(localStorage.getItem('mq_streak')||'0');
  if(last===today)return;
  const yest=new Date(Date.now()-86400000).toDateString();
  streak=(last===yest)?streak+1:1;
  localStorage.setItem('mq_streak',streak);
  localStorage.setItem('mq_last',today);
  loadStreak();
}
function loadStreak(){
  const streak=parseInt(localStorage.getItem('mq_streak')||'0');
  const bar=document.getElementById('streakBar');
  if(streak>0){bar.style.display='flex';document.getElementById('streakNum').textContent=streak}
}

/* ============ init ============ */
function init(){
  buildLangBar();
  applyLang();
  loadStreak();
  const inp=document.getElementById('photoInput');
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>signFromData(e.target.result,f.name);r.readAsDataURL(f)};
}
init();
</script>
